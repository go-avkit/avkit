name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:
  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -race -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. Container parsing reads multi-byte fields with
  # explicit byte order, so this is also the big-/little-endian correctness gate
  # (s390x is big-endian).
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          # loong64 carries a known upstream code-generation defect that this
          # lane cannot fully rule out -- golang/go#81000. On LOONG64 all four
          # float-to-integer ops are declared with a floating-point output for
          # an integer result (LOONG64Ops.go: TRUNCFW/TRUNCDW/TRUNCFV/TRUNCDV,
          # each `reg: fp11`). An integer that inherits an FP register is then
          # spilled with an 8-byte MOVD; where that value is a uint8 in a
          # 1-byte slot, the spill destroys its neighbour. CL 820040 wraps the
          # conversions in MOVWfpgp/MOVVfpgp so the integer lands in a GP
          # register.
          #
          # go1.27.1 does NOT contain that CL. Read in the released toolchain
          # rather than inferred from a changelog: LOONG64.rules still reads
          #
          #   (Cvt64Fto32 ...) => (TRUNCDW ...)
          #
          # with TRUNCDW still declared `reg: fp11`. The 1.27 backport,
          # golang/go#81147, is open with milestone Go1.27.2.
          #
          # What that means here, measured rather than assumed:
          #
          #   GOARCH=loong64 go build -gcflags=-S ./... | grep -oE 'TRUNC(FW|DW|FV|DV)'
          #
          # emits 15 TRUNCDV for this module under go1.27.1, from nine
          # functions -- vp9StreamConfig, demuxMatroska, newMatroskaReader,
          # mkvTrack, mkvTrackConfig, (*Muxer).WriteSample, (*Muxer).shouldFlush,
          # (*ProgressiveMuxer).WriteSample and (*ProgressiveMuxer).chunkLimit.
          # All nine are duration-and-limit arithmetic landing in a uint64, not
          # in a uint8, so the spill that corrupts a neighbouring byte has no
          # byte to corrupt. The other six go-avkit modules emit none of the
          # four ops at all, and are structurally immune.
          #
          # The lane below is green on loong64, and it is not blind: those nine
          # functions are covered, so the suite executes them under qemu. Treat
          # that as support, not proof -- go-gfx/gfx established the same
          # defect on real LoongArch silicon (cfarm401) and explicitly NOT from
          # qemu, and pins its own loong64 lane to go1.26.4 for it. If this
          # lane ever goes red on loong64 alone, suspect this before the code.
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
